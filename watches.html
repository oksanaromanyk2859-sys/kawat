<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلب ساعة التوكن — KAWAT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Noto+Kufi+Arabic:wght@100..900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:'Noto Kufi Arabic','Figtree',system-ui,sans-serif;background:#fff;color:#2b2928;line-height:1.7;min-height:100dvh;overflow-x:hidden}
    a{text-decoration:none;color:inherit}
    img{display:block;max-width:100%}
    button{cursor:pointer;font:inherit;border:none;background:none}

    .header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #e8e5e1}
    .header-inner{width:min(1320px,100% - 32px);margin:0 auto;height:64px;display:flex;align-items:center;justify-content:space-between}
    .back-link{display:inline-flex;align-items:center;gap:8px;color:#24604f;font-weight:700;font-size:.95rem}
    .back-link:hover{gap:12px}
    .header-logo img{width:44px;height:44px;border-radius:6px;object-fit:contain}

    .hero{background:linear-gradient(160deg,#e2f7dd 0%,#fff 60%);padding:48px 0 32px;text-align:center}
    .hero h1{font-size:clamp(1.4rem,4vw,2.2rem);font-weight:900;color:#24604f;margin-bottom:10px}
    .hero p{font-size:clamp(.9rem,2.5vw,1.05rem);color:#433f3e;max-width:520px;margin:0 auto;padding:0 16px}

    .grid-wrap{width:min(1320px,100% - 32px);margin:0 auto;padding:32px 0 120px}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}

    .card{background:#fff;border-radius:20px;border:2px solid #e8e5e1;overflow:hidden;transition:all .3s ease;position:relative;display:flex;flex-direction:column}
    .card:hover{border-color:#b8e0b0;box-shadow:0 8px 32px rgba(0,0,0,.1);transform:translateY(-4px)}
    .card.selected{border-color:#399624;box-shadow:0 0 0 3px #e2f7dd,0 8px 32px rgba(57,150,36,.15)}
    .card-check{position:absolute;top:12px;left:12px;width:32px;height:32px;background:#399624;color:#fff;border-radius:50%;display:none;place-items:center;font-size:.9rem;font-weight:900;z-index:2}
    .card.selected .card-check{display:grid}

    .card-img{aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:20px;background:#fafafa}
    .card-img img{width:75%;height:75%;object-fit:contain;transition:transform .4s ease}
    .card:hover .card-img img{transform:scale(1.06)}

    .card-body{padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
    .card-name{font-weight:700;font-size:.95rem;color:#2b2928;text-align:center}
    .card-color{display:inline-block;background:#f0faf0;color:#24604f;font-size:.78rem;font-weight:600;padding:4px 14px;border-radius:50px;text-align:center;align-self:center}
    .card-btns{display:flex;gap:8px;margin-top:auto}
    .card-btns > *{flex:1;padding:10px 8px;border-radius:12px;font-weight:700;font-size:.82rem;text-align:center;transition:all .25s ease;line-height:1.3}

    .btn-select{background:#24604f;color:#fff;border:none}
    .btn-select:hover{background:#1e4f42}
    .card.selected .btn-select{background:#399624}

    .btn-feat{background:#fff;color:#24604f;border:1.5px solid #24604f;display:inline-flex;align-items:center;justify-content:center}
    .btn-feat:hover{background:#24604f;color:#fff}

    .bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e8e5e1;padding:14px 16px;box-shadow:0 -6px 24px rgba(0,0,0,.08);transform:translateY(100%);transition:transform .4s cubic-bezier(.4,0,.2,1);z-index:60}
    .bar.show{transform:translateY(0)}
    .bar-inner{width:min(1320px,100% - 32px);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .bar-info{display:flex;align-items:center;gap:10px}
    .bar-thumb{width:44px;height:44px;border-radius:50%;border:2px solid #399624;padding:3px;object-fit:contain;background:#fff}
    .bar-name{font-weight:700;font-size:.9rem}
    .bar-label{font-size:.78rem;color:#399624;font-weight:600}
    .btn-go{display:inline-flex;align-items:center;gap:8px;padding:12px 32px;background:#399624;color:#fff;border-radius:50px;font-weight:700;font-size:1rem;white-space:nowrap;transition:all .3s ease}
    .btn-go:hover{background:#2d7a1c;transform:scale(1.03)}

    @media(max-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:768px){
      .grid{grid-template-columns:repeat(2,1fr);gap:12px}
      .hero{padding:32px 0 20px}
      .grid-wrap{padding:20px 0 100px}
      .card-body{padding:10px 12px 14px;gap:8px}
      .card-name{font-size:.85rem}
      .card-btns > *{padding:9px 6px;font-size:.75rem;border-radius:10px}
      .card-img{padding:14px}
      .bar-inner{flex-direction:column}
      .btn-go{width:100%;justify-content:center}
    }
    @media(max-width:400px){
      .grid{grid-template-columns:repeat(2,1fr);gap:8px}
      .card{border-radius:14px}
      .card-btns{flex-direction:column;gap:6px}
      .card-color{font-size:.72rem;padding:3px 10px}
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="back-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        الرئيسية
      </a>
      <a href="index.html" class="header-logo"><img src="images/logo.jpg" alt="KAWAT"></a>
    </div>
  </header>

  <section class="hero">
    <h1>اختر ساعة التوكن</h1>
    <p>هديتنا لجميع عملاء البنك — اختر اللون المناسب لك</p>
  </section>

  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>

  <div class="bar" id="bar">
    <div class="bar-inner">
      <div class="bar-info">
        <img src="" alt="" class="bar-thumb" id="barThumb">
        <div><div class="bar-name" id="barName"></div><div class="bar-label">تم الاختيار</div></div>
      </div>
      <button class="btn-go" id="btnGo">
        متابعة الطلب
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
    </div>
  </div>

  <script>
    const W=[
      {id:5,name:'سوداء كلاسيكية',color:'أسود'},
      {id:6,name:'رمادية أنيقة',color:'رمادي'},
      {id:7,name:'بيضاء فاخرة',color:'أبيض'},
      {id:8,name:'وردية مميزة',color:'وردي'},
      {id:9,name:'كحلية رياضية',color:'كحلي'},
      {id:10,name:'خمرية كلاسيك',color:'خمري'},
      {id:11,name:'بيج عصرية',color:'بيج'},
      {id:12,name:'ذهبية فاخرة',color:'ذهبي'},
      {id:13,name:'بنية طبيعية',color:'بني'},
      {id:14,name:'برتقالية جريئة',color:'برتقالي'},
      {id:15,name:'بنفسجية أنيقة',color:'بنفسجي'},
      {id:16,name:'لافندر ناعمة',color:'لافندر'},
      {id:17,name:'كريمية دافئة',color:'كريمي'},
      {id:18,name:'سماوية منعشة',color:'سماوي'},
      {id:19,name:'زرقاء كلاسيك',color:'أزرق'},
      {id:20,name:'صفراء مشرقة',color:'أصفر'},
      {id:21,name:'حمراء جريئة',color:'أحمر'},
      {id:22,name:'زيتية عسكرية',color:'زيتي'},
      {id:23,name:'خضراء طبيعية',color:'أخضر'}
    ];
    const grid=document.getElementById('grid'),bar=document.getElementById('bar');
    let sel=null;
    W.forEach(w=>{
      const c=document.createElement('div');
      c.className='card';
      c.dataset.id=w.id;
      c.innerHTML=`
        <div class="card-check">✓</div>
        <div class="card-img"><img src="images/watch-${w.id}.jpg" alt="${w.name}"></div>
        <div class="card-body">
          <div class="card-name">${w.name}</div>
          <span class="card-color">${w.color}</span>
          <div class="card-btns">
            <button class="btn-select" data-id="${w.id}">اختر ساعتك</button>
            <a href="watch-features.html?id=${w.id}" class="btn-feat">المميزات</a>
          </div>
        </div>`;
      grid.appendChild(c);
    });
    grid.addEventListener('click',e=>{
      const b=e.target.closest('.btn-select');
      if(!b)return;
      const id=+b.dataset.id,card=b.closest('.card'),w=W.find(x=>x.id===id);
      document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));
      if(sel===id){sel=null;bar.classList.remove('show');return}
      sel=id;card.classList.add('selected');
      document.getElementById('barThumb').src=`images/watch-${id}.jpg`;
      document.getElementById('barName').textContent=w.name;
      bar.classList.add('show');
    });
    document.getElementById('btnGo').addEventListener('click',()=>{
      if(sel)alert('تم اختيار الساعة بنجاح! سيتم التواصل معك قريباً.');
    });
  </script>
</body>
</html>
